name: Allure Report

on:
  push:
    branches: [ "qa-kotlin-6-1" ]

permissions:
  contents: write

jobs:
  allure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Run Tests
        run: ./gradlew test
        continue-on-error: true

      - name: Download Allure Binary
        run: |
          curl -L "https://github.com" -o allure.tgz
          tar -zxf allure.tgz
          chmod +x allure-2.24.0/bin/allure

      - name: Generate Report
        run: |
          # Добавлен прямой путь к бинарному файлу
          ./allure-2.24.0/bin/allure generate app/build/allure-results -o reports --clean

      - name: Commit and Push Report
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add reports/
          # [skip ci] чтобы избежать бесконечного цикла запусков
          git commit -m "docs: update allure report [skip ci]" || echo "No changes to commit"
          git push origin HEAD:${{ github.ref }}