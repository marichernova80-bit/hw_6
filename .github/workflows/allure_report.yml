name: Allure Report

on:
  push:
    branches: [ "qa-kotlin-6-1" ]

permissions:
  contents: write

jobs:
  allure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Run Tests
        # Ваши тесты создадут JSON файлы через функцию generateAllureStep
        run: ./gradlew test --continue
        continue-on-error: true

      # План Б: используем встроенный установщик, чтобы не писать ссылки
      - name: Install Allure CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y wget
          # Используем команду, которая сама найдет файл, без ручного ввода домена
          wget -O allure.deb https://github.com
          sudo dpkg -i allure.deb || sudo apt-get install -f -y

      - name: Generate Report
        run: |
          # Генерируем отчет из папки, созданной вашим кодом
          allure generate app/build/allure-results -o reports --clean

      - name: Upload to GitHub
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add reports/
          git commit -m "Update Allure report [skip ci]" || echo "No changes"
          git push origin HEAD:${{ github.ref }}