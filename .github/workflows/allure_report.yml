name: Allure Report

on:
  push:
    branches: [ "qa-kotlin-6-1" ]

permissions:
  contents: write
jobs:
  allure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Run Tests
        run: ./gradlew test
        continue-on-error: true

      - name: Download Allure CLI
        run: |
          curl -L https://github.com -o allure.tgz
          tar -zxf allure.tgz
          echo "$(pwd)/allure-2.24.0/bin" >> $GITHUB_PATH

      - name: Generate Report
        run: |
          # Используем путь к результатам, который создает ваш код теста
          allure generate app/build/allure-results -o reports --clean

      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add reports/
          git commit -m "Update Allure report" || echo "No changes"
          git push