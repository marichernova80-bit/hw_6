name: Allure Report

on:
  push:
    branches: [ "qa-kotlin-6-1" ]

permissions:
  contents: write
jobs:
  allure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Run Tests
        run: ./gradlew test
        continue-on-error: true

      # Добавляем этот шаг перед "замороженным" блоком
      - name: Prepare Allure Binary
        run: |
          # 1. Скачиваем архив с бинарными файлами (не deb)
          wget https://github.com
          tar -zxf allure-2.24.0.tgz

          # 2. Копируем содержимое в системную папку /usr/local/
          # Это сделает команду 'allure' доступной глобально
          sudo cp -r allure-2.24.0/* /usr/local/

          # 3. Также подкладываем deb файл, чтобы "замороженный" блок не упал
          cp allure-2.24.0.tgz allure_2.24.0-1_allure.deb

      - name: Install Allure CLI
        run: |
          wget "https://github.com"
          sudo dpkg -i allure_2.24.0-1_allure.deb || sudo apt-get install -f -y

      - name: Generate Report
        run: |
          # Проверяем версию для отладки и генерируем отчет
          allure --version
          allure generate app/build/allure-results -o reports --clean
      

      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add reports/
          git commit -m "Update Allure report" || echo "No changes"
          git push