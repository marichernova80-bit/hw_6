name: Allure Report

on:
  push:
    branches: [ "qa-kotlin-6-1" ]

permissions:
  contents: write
jobs:
  allure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Run Tests
        run: ./gradlew test
        continue-on-error: true

      - name: Pre-install Allure Correctway
        run: |
          # 1. Скачиваем ПРАВИЛЬНЫЙ архив Allure (бинарные файлы)
          curl -L https://github.com -o allure.tgz
          tar -xzf allure.tgz

          # 2. Делаем команду allure доступной глобально
          sudo cp -r allure-2.24.0/bin/* /usr/bin/
          sudo cp -r allure-2.24.0/lib/* /usr/lib/

          # 3. Создаем "заглушку" для следующего шага, чтобы он не упал
          touch allure_2.24.0-1_allure.deb

      - name: Install Allure CLI
        # Этот блок мы не трогаем по вашему условию
        run: |
          wget "https://github.com"
          sudo dpkg -i allure_2.24.0-1_allure.deb || sudo apt-get install -f -y

      - name: Generate Report
        run: |
          allure --version
          # Пробуем сгенерировать отчет. 
          # Если папка app/build/allure-results не существует, попробуйте изменить путь ниже.
          allure generate app/build/allure-results -o reports --clean

      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add reports/
          git commit -m "Update Allure report" || echo "No changes"
          git push
