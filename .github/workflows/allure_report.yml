name: Allure Report

on:
  push:
    branches: [ "qa-kotlin-6-1" ]

permissions:
  contents: write # Критически важно для записи отчета в репозиторий

jobs:
  allure-job:
    runs-on: ubuntu-latest # Стандартная среда выполнения в GitHub

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Run Tests
        # Запускаем тесты. Даже если они упадут, отчет будет создан
        run: ./gradlew test --continue
        continue-on-error: true

      - name: Install Allure CLI
        # Самый надежный способ: скачиваем архив и прописываем путь
        run: |
          curl -L "https://github.com" -o allure.tgz
          tar -zxf allure.tgz
          echo "$(pwd)/allure-2.24.0/bin" >> $GITHUB_PATH

      - name: Generate Allure Report
        run: |
          # Создаем отчет из папки, которую генерирует ваш TaskViewModelTest
          allure generate app/build/allure-results -o reports --clean

      - name: Commit and Push Report
        run: |
          git config --local user.email "github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"
          
          # Проверяем, создалась ли папка reports
          if [ -d "reports" ]; then
            git add reports/
            # Коммитим только если есть изменения
            git commit -m "docs: update allure report [skip ci]" || echo "No changes to commit"
            git push origin HEAD:${{ github.ref }}
          else
            echo "Папка reports не найдена, пропускаем пуш."
          fi
