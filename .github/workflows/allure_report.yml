name: Allure Report

on:
  push:
    branches: [ "qa-kotlin-6-1" ]

permissions:
  contents: write
jobs:
  allure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Run Tests
        run: ./gradlew test
        continue-on-error: true

      # --- ДОБАВЬТЕ ЭТОТ БЛОК ---
      - name: Pre-install Allure
        run: |
          # Скачиваем реальный deb-пакет, который ожидает заблокированный блок
          wget https://github.com
          # Устанавливаем его заранее корректно
          sudo dpkg -i allure_2.24.0-1_allure.deb || sudo apt-get install -f -y
      # --------------------------

      - name: Install Allure CLI
        run: |
          wget "https://github.com"
          sudo dpkg -i allure_2.24.0-1_allure.deb || sudo apt-get install -f -y

      - name: Generate Report
        run: |
          # Используем полный путь, если команда allure все еще не видна в PATH
          /usr/bin/allure generate app/build/allure-results -o reports --clean || allure generate app/build/allure-results -o reports --clean


      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add reports/
          git commit -m "Update Allure report" || echo "No changes"
          git push