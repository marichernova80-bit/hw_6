name: Allure Report

on:
  push:
    branches: [ "qa-kotlin-6-1" ]

permissions:
  contents: write
jobs:
  allure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Run Tests
        run: ./gradlew test
        continue-on-error: true

      # Добавляем этот шаг перед "замороженным" блоком
      - name: Force Prepare Allure Deb
        run: |
          # 1. Скачиваем ПРАВИЛЬНЫЙ файл, который ожидает заблокированный блок
          wget -O allure_2.24.0-1_allure.deb https://github.com

          # 2. Устанавливаем зависимости вручную (openjdk часто нужен для работы allure)
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jre-headless

          # 3. Предварительно устанавливаем пакет
          sudo dpkg -i allure_2.24.0-1_allure.deb || sudo apt-get install -f -y

      - name: Install Allure CLI
        run: |
          wget "https://github.com"
          sudo dpkg -i allure_2.24.0-1_allure.deb || sudo apt-get install -f -y

      - name: Generate Report
        run: |
          # Используем просто allure, так как после успешной установки он должен быть в PATH
          allure generate app/build/allure-results -o reports --clean
      

      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add reports/
          git commit -m "Update Allure report" || echo "No changes"
          git push