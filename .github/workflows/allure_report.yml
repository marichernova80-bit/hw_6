name: Allure Report

on:
  push:
    branches: [ "qa-kotlin-6-1" ]

permissions:
  contents: write
jobs:
  allure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Run Tests
        run: ./gradlew test
        continue-on-error: true

      - name: Install Allure
        run: |
          wget https://github.com
          sudo dpkg -i allure_2.24.0-1_allure.deb

      - name: Generate Report
        run: |
          # Ищем папку, которую мы создали в коде теста
          allure generate app/build/allure-results -o reports --clean

      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add reports/
          git commit -m "Add allure report" || echo "No changes"
          git push
