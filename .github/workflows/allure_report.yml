name: Allure Report

on:
  push:
    branches: [ "qa-kotlin-6-1" ]

permissions:
  contents: write

jobs:
  allure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Run Tests
        run: ./gradlew test --continue
        continue-on-error: true

      - name: Install Allure CLI
        run: |
          wget https://github.com
          tar -zxf allure-2.24.0.tgz
          sudo mv allure-2.24.0 /opt/allure
          sudo ln -s /opt/allure/bin/allure /usr/bin/allure

      - name: Generate Report
        run: |
          # Ищем, где лежат результаты (вдруг путь отличается)
          RESULTS_DIR=$(find . -type d -name "allure-results" | head -n 1)
          if [ -z "$RESULTS_DIR" ]; then
            echo "результаты Allure не найдены!"
            exit 1
          fi
          allure generate "$RESULTS_DIR" -o reports --clean

      - name: Commit and Push Report
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add reports/
          git commit -m "Update Allure report" || echo "No changes to commit"
          git push
